<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaStream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#070710;
  --bg2:#0e0e1c;
  --bg3:#141428;
  --card:#0f0f1e;
  --accent:#e8365d;
  --accent2:#ff6040;
  --accent3:#ffa340;
  --gold:#f0b429;
  --text:#f0eff8;
  --text2:#c8c6e0;
  --muted:#6a688a;
  --border:rgba(255,255,255,.07);
  --border2:rgba(255,255,255,.12);
  --anime:#9d6bff;
  --manga:#00c9a7;
  --glow-r:rgba(232,54,93,.18);
  --glow-o:rgba(255,96,64,.12);
  --nav-h:68px;
  --ease-out-expo:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
}

/* ====== CUSTOM CURSOR ====== */
*{cursor:none}
#cursor{
  position:fixed;
  width:12px;height:12px;
  background:var(--accent);
  border-radius:50%;
  pointer-events:none;
  z-index:9999;
  transform:translate(-50%,-50%);
  transition:transform .08s,width .25s var(--ease-out-expo),height .25s var(--ease-out-expo),background .25s,opacity .3s;
  mix-blend-mode:difference;
}
#cursor-ring{
  position:fixed;
  width:36px;height:36px;
  border:1.5px solid rgba(232,54,93,.5);
  border-radius:50%;
  pointer-events:none;
  z-index:9998;
  transform:translate(-50%,-50%);
  transition:transform .15s var(--ease-out-expo),width .3s var(--ease-out-expo),height .3s var(--ease-out-expo),opacity .3s,border-color .3s;
}
body:has(.card:hover) #cursor{width:20px;height:20px;background:var(--accent2)}
body:has(.card:hover) #cursor-ring{width:60px;height:60px;border-color:rgba(232,54,93,.25)}
body:has(button:hover) #cursor{background:var(--text);transform:translate(-50%,-50%) scale(.6)}

html,body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  scroll-behavior:smooth;
}

/* ====== NOISE GRAIN OVERLAY ====== */
body::before{
  content:'';
  position:fixed;
  inset:0;
  opacity:.025;
  pointer-events:none;
  z-index:9997;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:180px;
}

/* ====== SCROLLBAR ====== */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:rgba(232,54,93,.3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(232,54,93,.5)}

/* ====== NAV ====== */
nav{
  position:fixed;
  top:0;left:0;right:0;
  z-index:200;
  height:var(--nav-h);
  display:flex;
  align-items:center;
  gap:2rem;
  padding:0 2.5rem;
  transition:background .5s,box-shadow .5s,border-color .5s;
}
nav.scrolled{
  background:rgba(7,7,16,.92);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border-bottom:1px solid var(--border);
  box-shadow:0 1px 0 rgba(255,255,255,.03),0 20px 60px rgba(0,0,0,.5);
}

.nav-logo{
  font-family:'Syne',sans-serif;
  font-size:1.35rem;
  font-weight:800;
  letter-spacing:.18em;
  text-transform:uppercase;
  position:relative;
  display:flex;
  align-items:center;
  gap:.5rem;
  flex-shrink:0;
}
.nav-logo-mark{
  width:28px;height:28px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:.75rem;
  box-shadow:0 0 20px rgba(232,54,93,.4);
  transition:box-shadow .3s,transform .3s var(--ease-spring);
}
.nav-logo:hover .nav-logo-mark{
  box-shadow:0 0 35px rgba(232,54,93,.6);
  transform:rotate(-5deg) scale(1.1);
}
.nav-logo-text{
  background:linear-gradient(135deg,var(--text) 0%,var(--text2) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

.nav-links{
  display:flex;
  gap:.2rem;
  flex:1;
}
.nav-link{
  position:relative;
  padding:.45rem 1rem;
  border-radius:6px;
  font-size:.8rem;
  font-weight:500;
  color:var(--muted);
  cursor:none;
  transition:color .3s;
  border:none;background:transparent;
  font-family:'DM Sans',sans-serif;
  letter-spacing:.04em;
  overflow:hidden;
}
.nav-link::before{
  content:'';
  position:absolute;inset:0;
  background:rgba(255,255,255,.06);
  border-radius:6px;
  transform:scaleX(0);
  transition:transform .3s var(--ease-out-expo);
  transform-origin:left;
}
.nav-link:hover{color:var(--text)}
.nav-link:hover::before{transform:scaleX(1)}
.nav-link.active{color:var(--text)}
.nav-link.active::after{
  content:'';
  position:absolute;
  bottom:4px;left:50%;
  transform:translateX(-50%);
  width:16px;height:2px;
  background:var(--accent);
  border-radius:1px;
  box-shadow:0 0 8px rgba(232,54,93,.6);
}

.nav-right{
  display:flex;align-items:center;
  gap:1rem;margin-left:auto;
}

.search-wrap{
  position:relative;
  display:flex;align-items:center;
}
.search-icon-btn{
  width:38px;height:38px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.05);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--muted);
  font-size:1rem;
  transition:all .25s;
  cursor:none;
}
.search-icon-btn:hover{background:rgba(255,255,255,.09);color:var(--text);border-color:var(--border2)}

.search-box{
  position:absolute;
  right:0;
  width:0;
  overflow:hidden;
  transition:width .4s var(--ease-out-expo);
}
.search-box.open{width:260px}
.search-box input{
  width:100%;
  padding:.5rem 1rem .5rem 2.5rem;
  background:rgba(14,14,28,.95);
  border:1px solid var(--border2);
  border-radius:8px;
  color:var(--text);
  font-size:.82rem;
  font-family:'DM Sans',sans-serif;
  outline:none;
  transition:border-color .3s,box-shadow .3s;
}
.search-box input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(232,54,93,.12),0 0 20px rgba(232,54,93,.08);
}
.search-box input::placeholder{color:var(--muted)}
.search-box .s-icon{
  position:absolute;left:.8rem;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:.85rem;pointer-events:none;
}

.profile-btn{
  display:flex;align-items:center;gap:.7rem;
  padding:.4rem .8rem .4rem .4rem;
  background:rgba(255,255,255,.05);
  border:1px solid var(--border);
  border-radius:8px;
  cursor:none;
  transition:all .25s;
  color:var(--text2);
  font-size:.8rem;font-weight:500;
}
.profile-btn:hover{background:rgba(255,255,255,.09);border-color:var(--border2);color:var(--text)}
.profile-avatar{
  width:30px;height:30px;
  border-radius:7px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-size:.82rem;font-weight:700;
  box-shadow:0 4px 12px rgba(232,54,93,.3);
  transition:box-shadow .3s,transform .3s var(--ease-spring);
}
.profile-btn:hover .profile-avatar{
  box-shadow:0 6px 20px rgba(232,54,93,.45);
  transform:scale(1.08);
}

/* ====== PROFILES MODAL ====== */
.overlay-modal{
  display:none;
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(16px);
  align-items:center;justify-content:center;
}
.overlay-modal.open{
  display:flex;
  animation:fadeIn .3s var(--ease-out-expo);
}
.modal-box{
  background:linear-gradient(145deg,var(--bg2),var(--bg3));
  border:1px solid var(--border2);
  border-radius:20px;
  padding:2.5rem;
  max-width:540px;width:90%;
  box-shadow:0 30px 80px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.03) inset;
  animation:slideUp .4s var(--ease-spring);
}
.modal-title{
  font-family:'Syne',sans-serif;
  font-size:1.5rem;font-weight:700;
  letter-spacing:.06em;
  margin-bottom:2rem;
  color:var(--text);
}
.profiles-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
  gap:1rem;
  margin-bottom:2rem;
}
.profile-item{
  display:flex;flex-direction:column;align-items:center;gap:.6rem;
  cursor:none;
  padding:1rem .5rem;
  border-radius:12px;
  border:1px solid var(--border);
  transition:all .3s var(--ease-spring);
  background:rgba(255,255,255,.02);
}
.profile-item:hover{
  border-color:rgba(232,54,93,.4);
  background:rgba(232,54,93,.08);
  transform:translateY(-4px);
}
.profile-item.active{
  border-color:rgba(232,54,93,.6);
  background:linear-gradient(135deg,rgba(232,54,93,.15),rgba(255,96,64,.08));
  box-shadow:0 0 30px rgba(232,54,93,.2);
}
.profile-avatar-lg{
  width:64px;height:64px;border-radius:16px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-size:1.8rem;
  box-shadow:0 8px 24px rgba(232,54,93,.28);
}
.profile-item .name{font-size:.8rem;font-weight:500;color:var(--text2);text-align:center}
.profile-item.active .name{color:var(--accent)}
.add-profile{opacity:.5;transition:opacity .3s}
.add-profile:hover{opacity:1}
.modal-actions{display:flex;gap:.8rem;justify-content:flex-end}

.btn-primary{
  background:var(--accent);
  color:#fff;border:none;
  border-radius:8px;
  padding:.65rem 1.8rem;
  font-weight:600;font-size:.82rem;
  font-family:'DM Sans',sans-serif;
  cursor:none;
  transition:all .25s var(--ease-spring);
  letter-spacing:.04em;
  box-shadow:0 8px 24px rgba(232,54,93,.35);
  position:relative;overflow:hidden;
}
.btn-primary::after{
  content:'';
  position:absolute;inset:0;
  background:rgba(255,255,255,0);
  transition:background .2s;
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 32px rgba(232,54,93,.45);
}
.btn-primary:hover::after{background:rgba(255,255,255,.08)}
.btn-primary:active{transform:translateY(0)}

.btn-ghost{
  background:transparent;
  color:var(--text2);
  border:1px solid var(--border2);
  border-radius:8px;
  padding:.65rem 1.8rem;
  cursor:none;transition:all .25s;
  font-size:.82rem;font-weight:500;
  font-family:'DM Sans',sans-serif;
}
.btn-ghost:hover{border-color:var(--border2);color:var(--text);background:rgba(255,255,255,.05)}

/* ====== HERO ====== */
.hero{
  position:relative;
  height:100vh;min-height:680px;
  display:flex;align-items:flex-end;
  overflow:hidden;
  margin-top:var(--nav-h);
}
.hero-bg{
  position:absolute;inset:-20px;
  background-size:cover;background-position:center 30%;
  transition:background-image 1.2s ease,transform 10s linear;
  transform-origin:center;
  will-change:transform;
}
.hero-bg.ken-burns{transform:scale(1.06) translateX(1%)}
.hero-vignette{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 80% at 0% 100%,rgba(7,7,16,.98) 0%,transparent 55%),
    linear-gradient(to top,var(--bg) 0%,rgba(7,7,16,.8) 30%,rgba(7,7,16,.3) 60%,transparent 85%);
}
.hero-side-fade{
  position:absolute;inset:0;
  background:linear-gradient(to right,rgba(7,7,16,.97) 0%,rgba(7,7,16,.6) 40%,transparent 75%);
}

/* Ambient glow */
.hero-glow{
  position:absolute;
  bottom:-20%;left:-10%;
  width:70%;height:80%;
  border-radius:50%;
  background:radial-gradient(ellipse,rgba(232,54,93,.08) 0%,transparent 65%);
  pointer-events:none;
}

.hero-content{
  position:relative;z-index:2;
  padding:0 4rem 7rem;
  max-width:700px;
}

.hero-tag{
  display:inline-flex;align-items:center;gap:.5rem;
  background:rgba(232,54,93,.12);
  border:1px solid rgba(232,54,93,.28);
  border-radius:20px;
  padding:.35rem 1rem;
  font-size:.72rem;font-weight:600;
  color:var(--accent);
  letter-spacing:.1em;text-transform:uppercase;
  margin-bottom:1.5rem;
  backdrop-filter:blur(8px);
  animation:tagPulse 3s ease-in-out infinite;
}
@keyframes tagPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(232,54,93,.2)}
  50%{box-shadow:0 0 0 6px rgba(232,54,93,0)}
}

.hero-meta{
  display:flex;align-items:center;gap:1rem;
  margin-bottom:1.2rem;
  font-size:.78rem;color:var(--muted);
  flex-wrap:wrap;
}
.hero-rating{
  display:flex;align-items:center;gap:.4rem;
  color:var(--gold);font-weight:700;font-size:.9rem;
}
.hero-year{
  background:rgba(255,255,255,.08);
  border-radius:4px;padding:.2rem .55rem;
  font-size:.75rem;
}
.hero-genre{
  color:var(--anime);font-size:.75rem;
  background:rgba(157,107,255,.12);
  border-radius:4px;padding:.2rem .55rem;
}
.hero-dot{
  width:3px;height:3px;border-radius:50%;
  background:var(--muted);opacity:.5;
}

.hero h1{
  font-family:'Syne',sans-serif;
  font-size:clamp(3.5rem,7.5vw,6.5rem);
  line-height:.9;
  letter-spacing:-.02em;
  font-weight:800;
  color:#fff;
  margin-bottom:1.4rem;
  text-shadow:0 4px 40px rgba(0,0,0,.6);
  transform:translateY(20px);opacity:0;
  animation:heroTextIn .8s .2s var(--ease-out-expo) forwards;
}
@keyframes heroTextIn{to{transform:translateY(0);opacity:1}}

.hero-desc{
  font-size:.95rem;
  color:rgba(240,239,248,.7);
  line-height:1.85;
  max-width:480px;
  margin-bottom:2.5rem;
  font-weight:300;
  transform:translateY(20px);opacity:0;
  animation:heroTextIn .8s .4s var(--ease-out-expo) forwards;
}

.hero-btns{
  display:flex;gap:1rem;flex-wrap:wrap;
  margin-bottom:3rem;
  transform:translateY(20px);opacity:0;
  animation:heroTextIn .8s .5s var(--ease-out-expo) forwards;
}
.btn-play{
  display:flex;align-items:center;gap:.7rem;
  background:var(--accent);
  color:#fff;border:none;
  border-radius:10px;
  padding:.9rem 2.2rem;
  font-family:'DM Sans',sans-serif;
  font-size:.9rem;font-weight:600;
  cursor:none;
  transition:all .3s var(--ease-spring);
  letter-spacing:.03em;
  box-shadow:0 12px 40px rgba(232,54,93,.4),0 0 0 0 rgba(232,54,93,.4);
  position:relative;overflow:hidden;
}
.btn-play::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.15) 0%,transparent 60%);
}
.btn-play:hover{
  transform:translateY(-3px) scale(1.02);
  box-shadow:0 16px 50px rgba(232,54,93,.5);
}
.btn-play:active{transform:translateY(0) scale(.98)}
.btn-play-icon{
  width:28px;height:28px;
  background:rgba(255,255,255,.2);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.75rem;
}

.btn-info{
  display:flex;align-items:center;gap:.6rem;
  background:rgba(255,255,255,.07);
  color:var(--text2);
  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;
  padding:.9rem 2rem;
  font-size:.9rem;font-weight:500;
  cursor:none;
  transition:all .3s;
  backdrop-filter:blur(8px);
}
.btn-info:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#fff}

/* Hero dots nav */
.hero-nav-dots{
  display:flex;gap:.5rem;
  transform:translateY(20px);opacity:0;
  animation:heroTextIn .8s .6s var(--ease-out-expo) forwards;
}
.h-dot{
  border:none;background:rgba(255,255,255,.2);
  border-radius:2px;height:3px;width:24px;
  cursor:none;transition:all .4s var(--ease-out-expo);
}
.h-dot.active{
  background:linear-gradient(to right,var(--accent),var(--accent2));
  width:48px;
  box-shadow:0 0 10px rgba(232,54,93,.5);
}

/* Progress bar */
.hero-progress{
  position:absolute;bottom:0;left:0;right:0;height:2px;
  background:rgba(255,255,255,.06);z-index:3;
}
.hero-progress-bar{
  height:100%;
  background:linear-gradient(to right,var(--accent),var(--accent2));
  width:0%;
  transition:width 8s linear;
  box-shadow:0 0 8px rgba(232,54,93,.4);
}

/* ====== MAIN ====== */
main{
  padding:3.5rem 2.5rem;
  max-width:1920px;
  margin:0 auto;
}

/* ====== SECTIONS ====== */
.section{
  margin-bottom:4.5rem;
  opacity:0;transform:translateY(24px);
  transition:opacity .7s var(--ease-out-expo),transform .7s var(--ease-out-expo);
}
.section.visible{opacity:1;transform:translateY(0)}

.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1.8rem;
}
.section-title{
  display:flex;align-items:center;gap:.8rem;
  font-family:'Syne',sans-serif;
  font-size:1.15rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;
  color:var(--text);
}
.section-line{
  width:3px;height:18px;border-radius:2px;
  background:linear-gradient(to bottom,var(--accent),var(--accent2));
  box-shadow:0 0 12px rgba(232,54,93,.5);
  flex-shrink:0;
}
.section-line.anime{background:var(--anime);box-shadow:0 0 12px rgba(157,107,255,.5)}
.section-line.manga{background:var(--manga);box-shadow:0 0 12px rgba(0,201,167,.5)}

.view-all{
  display:flex;align-items:center;gap:.4rem;
  font-size:.77rem;color:var(--muted);
  cursor:none;
  padding:.4rem 1rem;
  border:1px solid var(--border);
  border-radius:20px;
  transition:all .3s;
  background:transparent;
  font-family:'DM Sans',sans-serif;
  font-weight:500;
  letter-spacing:.04em;
}
.view-all:hover{
  color:var(--accent);
  border-color:rgba(232,54,93,.3);
  background:rgba(232,54,93,.06);
  gap:.7rem;
}

/* ====== CAROUSEL ====== */
.carousel{
  display:flex;gap:1rem;
  overflow-x:auto;
  padding-bottom:1rem;
  scroll-behavior:smooth;
  scrollbar-width:none;
}
.carousel::-webkit-scrollbar{display:none}

/* ====== CARD ====== */
.card{
  flex-shrink:0;
  width:185px;
  border-radius:12px;
  overflow:hidden;
  background:var(--card);
  cursor:none;
  position:relative;
  border:1px solid var(--border);
  transition:transform .45s var(--ease-spring),border-color .3s,box-shadow .45s;
  box-shadow:0 4px 20px rgba(0,0,0,.35);
}
.card:hover{
  transform:translateY(-14px) scale(1.04);
  border-color:rgba(232,54,93,.4);
  box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1px rgba(232,54,93,.15),0 0 40px rgba(232,54,93,.12);
  z-index:10;
}

.card-img{
  width:100%;aspect-ratio:2/3;
  background:linear-gradient(145deg,var(--bg3),var(--bg2));
  position:relative;overflow:hidden;
}
.card-img img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .6s var(--ease-out-expo);
}
.card:hover .card-img img{transform:scale(1.12)}

.card-placeholder{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  font-size:3rem;
  background:linear-gradient(145deg,var(--bg3),#1a1a35);
}

.card-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.9) 0%,rgba(0,0,0,.5) 50%,transparent 100%);
  opacity:0;
  transition:opacity .4s;
}
.card:hover .card-overlay{opacity:1}

.card-play{

  bottom:1.2rem;left:50%;

  display:flex;align-items:center;justify-content:center;
  cursor:none;color:#fff;font-size:1.1rem;
  opacity:0;
  transition:all .4s var(--ease-spring);
  box-shadow:0 8px 30px rgba(232,54,93,.5);
  z-index:3;
}
.card:hover .card-play{
  opacity:1;
  transform:translateX(-50%) scale(1);
}

  transform:translateX(-50%) scale(1.12)!important;
  box-shadow:0 12px 40px rgba(232,54,93,.6);

.card-badge{

  border:1px solid rgba(255,255,255,.15);
  border-radius:4px;
  padding:.2rem .45rem;
  font-size:.6rem;font-weight:700;

}

.card-info{padding:.9rem .9rem .8rem}
.card-title{
  font-size:.82rem;font-weight:600;

  margin-bottom:.45rem;color:var(--text);
  transition:color .3s;
}
.card:hover .card-title{color:#fff}
.card-meta{

.card-rating{

/* ====== GRID ====== */

/* ====== PAGE HEADER ====== */

}

}
.page-title-accent{

}

/* ====== SKELETON ====== */
.skeleton{
  border-radius:12px;
  background:linear-gradient(90deg,var(--bg3) 25%,rgba(255,255,255,.04) 50%,var(--bg3) 75%);

}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* ====== PLAYER ====== */

}
.player-modal.open{

}

}

/* ====== TOAST ====== */

  backdrop-filter:blur(20px);
}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ====== SCROLL INDICATOR ====== */
.scroll-indicator{
  position:absolute;bottom:2.5rem;left:50%;transform:translateX(-50%);
  z-index:5;display:flex;flex-direction:column;align-items:center;gap:.5rem;

@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}

/* ====== ANIMATIONS ====== */

/* Card stagger animation */

<script>
// ====== CUSTOM CURSOR ======
const cur = document.getElementById('cursor');
const ring = document.getElementById('cursor-ring');
let mx=0,my=0,rx=0,ry=0;

document.addEventListener('mousemove',e=>{
  mx=e.clientX;my=e.clientY;
  cur.style.left=mx+'px';cur.style.top=my+'px';
});

function animateRing(){
  rx+=(mx-rx)*.12;
  ry+=(my-ry)*.12;
  ring.style.left=rx+'px';ring.style.top=ry+'px';
  requestAnimationFrame(animateRing);
}
animateRing();

// ====== NAV SCROLL ======
const nav=document.getElementById('mainNav');
window.addEventListener('scroll',()=>{
  nav.classList.toggle('scrolled',window.scrollY>50);
},{ passive:true });

// ====== INTERSECTION OBSERVER (sections) ======
const io=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting) e.target.classList.add('visible');
  });
},{threshold:.12});
document.querySelectorAll('.section').forEach(s=>io.observe(s));

// ====== CONFIG ======
const API_BASE=window.location.origin==='http://localhost:3000'?'http://localhost:3000':window.location.origin;
const POSTER='https://image.tmdb.org/t/p/w500';
const BACKDROP='https://image.tmdb.org/t/p/original';

let heroItems=[],currentProfile=null,currentMangaPages=[],currentPageIdx=0;
let heroTimer=null,progressTimer=null,heroIdx=0;

// ====== DB ======
class NovaDB{
  async init(){this.db=await this._open()}
  _open(){
    return new Promise((res,rej)=>{
      const r=indexedDB.open('NovaStream2',1);
      r.onupgradeneeded=ev=>{
        const db=ev.target.result;
        ['profiles','history','favorites'].forEach(s=>{
          if(!db.objectStoreNames.contains(s))
            db.createObjectStore(s,{keyPath:'id'});
        });
      };
      r.onsuccess=ev=>res(ev.target.result);
      r.onerror=rej;
    });
  }
  _tx(store,mode,fn){
    return new Promise((res,rej)=>{
      const tx=this.db.transaction(store,mode);
      const req=fn(tx.objectStore(store));
      req.onsuccess=ev=>res(ev.target.result);
      req.onerror=rej;
    });
  }
  getAll(s){return this._tx(s,'readonly',st=>st.getAll())}
  get(s,k){return this._tx(s,'readonly',st=>st.get(k))}
  put(s,d){return this._tx(s,'readwrite',st=>st.put(d))}
}
const db=new NovaDB();

// ====== INIT ======
(async()=>{
  await db.init();
  await initProfiles();
  await loadHome();
})();

// ====== PROFILES ======
async function initProfiles(){
  let profiles=await db.getAll('profiles');
  if(!profiles.length){
    profiles=[
      {id:'p1',name:'Mon Profil',emoji:'🎬',color:'#e8365d',favorites:[],history:[]},
      {id:'p2',name:'Enfants',emoji:'🌟',color:'#9d6bff',favorites:[],history:[]}
    ];
    for(const p of profiles) await db.put('profiles',p);
  }
  currentProfile=profiles[0];
  updateProfileUI();
}
function updateProfileUI(){
  document.getElementById('profileAvatar').textContent=currentProfile.emoji;
  document.getElementById('profileName').textContent=currentProfile.name;
}
function openProfiles(){
  const modal=document.getElementById('profilesModal');
  const grid=document.getElementById('profilesGrid');
  db.getAll('profiles').then(profiles=>{
    grid.innerHTML=profiles.map(p=>`
      <div class="profile-item${p.id===currentProfile.id?' active':''}" onclick="selectProfile('${p.id}')">
        <div class="profile-avatar-lg">${p.emoji}</div>
        <div class="name">${p.name}</div>
      </div>
    `).join('')+`
      <div class="profile-item add-profile" onclick="createProfile()">
        <div class="profile-avatar-lg" style="background:rgba(255,255,255,.06);box-shadow:none;border:1px dashed rgba(255,255,255,.15)">＋</div>
        <div class="name">Nouveau</div>
      </div>
    `;
  });
  modal.classList.add('open');
}
function closeProfiles(){document.getElementById('profilesModal').classList.remove('open')}
async function selectProfile(id){
  currentProfile=await db.get('profiles',id);
  updateProfileUI();closeProfiles();
  showToast(`✓ Profil : ${currentProfile.name}`);
}
function createProfile(){
  const name=prompt('Nom du profil :');
  if(!name) return;
  const emojis=['🎬','🌟','⚡','🔥','🎮','🎵','🍿','🦁','🐱','🦊'];
  const p={id:'p_'+Date.now(),name,emoji:emojis[Math.floor(Math.random()*emojis.length)],favorites:[],history:[]};
  db.put('profiles',p).then(()=>{ selectProfile(p.id);openProfiles(); });
}

// ====== API ======
async function api(ep){
  try{
    const r=await fetch(`${API_BASE}/api${ep}`);
    if(!r.ok) throw new Error(r.status);
    return r.json();
  }catch(e){console.error('API',e);return null}
}

// ====== LOAD HOME ======
async function loadHome(){
  const [trending,series]=await Promise.all([
    api('/trending/movie'),api('/popular/tv')
  ]);
  if(trending?.results){
    heroItems=trending.results.slice(0,5);
    if(heroItems.length) startHero(0);
    renderCarousel('trendingCarousel',trending.results.slice(0,14),'movie');
  }
  if(series?.results){
    renderCarousel('seriesCarousel',series.results.slice(0,14),'tv');
    renderCarousel('animeCarousel',series.results.slice(0,14),'anime');
  }
  loadMangaCarousel();
}

// ====== HERO ======
function startHero(idx){
  clearTimeout(heroTimer);
  if(progressTimer) clearInterval(progressTimer);
  heroIdx=idx;
  const item=heroItems[idx];
  const bg=item.backdrop_path?`url('${BACKDROP+item.backdrop_path}')`:
            item.poster_path?`url('${POSTER+item.poster_path}')`:
            `linear-gradient(135deg,#1a1a35,#0e0e1c)`;
  const heroBg=document.getElementById('heroBg');
  heroBg.style.backgroundImage=bg;
  heroBg.classList.remove('ken-burns');
  void heroBg.offsetWidth;
  setTimeout(()=>heroBg.classList.add('ken-burns'),100);

  document.getElementById('heroTitle').textContent=item.title||item.name||'';
  document.getElementById('heroDesc').textContent=(item.overview||'').slice(0,200)+(item.overview?.length>200?'…':'');
  document.getElementById('heroRating').textContent=(item.vote_average||0).toFixed(1);
  document.getElementById('heroYear').textContent=(item.release_date||item.first_air_date||'').slice(0,4);
  const btn=document.getElementById('heroPlayBtn');
  btn.dataset.id=item.id;btn.dataset.type='movie';btn.dataset.title=item.title||item.name||'';

  // Dots
  document.getElementById('heroCarousel').innerHTML=heroItems.map((_,i)=>
    `<button class="h-dot${i===idx?' active':''}" onclick="startHero(${i})"></button>`
  ).join('');

  // Progress bar
  const bar=document.getElementById('heroProgress');
  bar.style.transition='none';bar.style.width='0%';
  void bar.offsetWidth;
  bar.style.transition='width 8s linear';bar.style.width='100%';

  heroTimer=setTimeout(()=>startHero((idx+1)%heroItems.length),8000);
}

// ====== SEARCH ======
let searchOpen=false;
function toggleSearch(btn){
  const box=document.getElementById('searchBox');
  searchOpen=!searchOpen;
  box.classList.toggle('open',searchOpen);
  if(searchOpen) setTimeout(()=>document.getElementById('searchInput').focus(),400);
}
function onSearch(){
  const q=document.getElementById('searchInput').value.trim();
  if(q) showToast(`🔍 "${q}"`);
}

// ====== RENDER CAROUSEL ======
function renderCarousel(id,items,type){
  document.getElementById(id).innerHTML=items.map((item,i)=>createCard(item,type,i)).join('');
}

function createCard(item,type,idx){
  const id=item.id||item.manga_id||item.id;
  const title=item.title||item.name||'Sans titre';
  const poster=item.poster_path?POSTER+item.poster_path:item.backdrop_path?POSTER+item.backdrop_path:'';
  const rating=(item.vote_average||0).toFixed(1);
  const year=(item.release_date||item.first_air_date||'').slice(0,4);

  let badge='';
  if(type==='anime') badge='<div class="card-badge anime">Animé</div>';
  else if(type==='manga') badge='<div class="card-badge manga">Manga</div>';
  else if(idx===0) badge='<div class="card-badge">Nouveau</div>';

  const delay=`animation-delay:${idx*60}ms`;

  return `
    <div class="card" onclick="playContent(${id},'${type}','${title.replace(/'/g,"\\'")}')" style="${delay}">
      <div class="card-img">
        ${poster
          ?`<img src="${poster}" alt="${title}" loading="lazy">`
          :`<div class="card-placeholder">${type==='anime'?'⚡':type==='manga'?'📖':'🎬'}</div>`
        }
        <div class="card-overlay"></div>
        <button class="card-play">▶</button>
        ${badge}
        ${rating>7?`<div class="card-hd">HD</div>`:''}
      </div>
      <div class="card-info">
        <div class="card-title">${title}</div>
        <div class="card-meta">
          <span class="card-rating">★ ${rating}</span>
          ${year?`<span>${year}</span>`:''}
        </div>
      </div>
    </div>`;
}

// ====== MANGA CAROUSEL ======
function loadMangaCarousel(){
  const mangas=[
    {id:'op',title:'One Piece',chapters:1110,emoji:'🏴‍☠️'},
    {id:'nar',title:'Naruto',chapters:700,emoji:'🍃'},
    {id:'aot',title:'Attack on Titan',chapters:139,emoji:'⚔️'},
    {id:'ds',title:'Demon Slayer',chapters:205,emoji:'🗡️'},
    {id:'jjk',title:'Jujutsu Kaisen',chapters:264,emoji:'💫'},
    {id:'sl',title:'Solo Leveling',chapters:179,emoji:'⚡'},
    {id:'cm',title:'Chainsaw Man',chapters:172,emoji:'🔪'},
    {id:'sf',title:'Spy x Family',chapters:102,emoji:'🕵️'},
  ];
  document.getElementById('mangaCarousel').innerHTML=mangas.map((m,i)=>`
    <div class="card" onclick="openMangaReader('${m.id}','${m.title}')" style="animation-delay:${i*60}ms">
      <div class="card-img">
        <div class="card-placeholder" style="font-size:2.5rem">${m.emoji}</div>
        <div class="card-overlay"></div>
        <button class="card-play">📖</button>
        <div class="card-badge manga">Manga</div>
      </div>
      <div class="card-info">
        <div class="card-title">${m.title}</div>
        <div class="card-meta"><span>${m.chapters} ch.</span></div>
      </div>
    </div>`).join('');
}

// ====== PLAYBACK ======
async function playContent(id,type,title){
  document.getElementById('playerTitle').textContent=title;
  document.getElementById('playerLoading').style.display='flex';
  document.getElementById('videoPlayer').src='';
  try{
    const data=await api(`/sources/${id}?type=${type}`);
    if(data?.sources?.length){
      const vid=document.getElementById('videoPlayer');
      vid.src=data.sources[0].url;
      document.getElementById('qualityBtns').innerHTML=(data.sources||[]).map((s,i)=>
        `<button class="q-btn${i===0?' active':''}" onclick="changeQ('${s.url}',this)">${s.quality||'720p'}</button>`
      ).join('');
      await db.put('history',{id:`${type}_${id}`,type,title,tmdbId:id,watchedAt:Date.now(),profileId:currentProfile.id});
    }else{
      showToast('❌ Aucune source disponible');
      document.getElementById('playerLoading').style.display='none';
      return;
    }
    document.getElementById('playerModal').classList.add('open');
    document.body.style.overflow='hidden';
  }catch(e){
    showToast('Erreur lecture');
    document.getElementById('playerLoading').style.display='none';
  }
}
function changeQ(url,btn){
  document.querySelectorAll('.q-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const vid=document.getElementById('videoPlayer');
  const t=vid.currentTime;vid.src=url;vid.currentTime=t;vid.play();
}
function playHero(){
  const btn=document.getElementById('heroPlayBtn');
  playContent(btn.dataset.id,btn.dataset.type,btn.dataset.title);
}
function closePlayer(){
  document.getElementById('playerModal').classList.remove('open');
  document.getElementById('videoPlayer').pause();
  document.body.style.overflow='';
}

// ====== MANGA READER ======
async function openMangaReader(id,title){
  document.getElementById('readerTitle').textContent=title;
  const mockPages=[
    `data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900"%3E%3Crect fill="%23111" width="600" height="900"/%3E%3Ctext x="50%25" y="45%25" text-anchor="middle" fill="%23e8365d" font-size="32" font-weight="bold" font-family="sans-serif"%3E${encodeURIComponent(title)}%3C/text%3E%3Ctext x="50%25" y="55%25" text-anchor="middle" fill="%23666" font-size="16" font-family="sans-serif"%3EChapitre 1 — Page 1%3C/text%3E%3C/svg%3E`,
    `data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900"%3E%3Crect fill="%230e0e0e" width="600" height="900"/%3E%3Ctext x="50%25" y="50%25" text-anchor="middle" fill="%23444" font-size="20" font-family="sans-serif"%3EPage 2%3C/text%3E%3C/svg%3E`,
    `data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900"%3E%3Crect fill="%23111" width="600" height="900"/%3E%3Ctext x="50%25" y="50%25" text-anchor="middle" fill="%23444" font-size="20" font-family="sans-serif"%3EPage 3%3C/text%3E%3C/svg%3E`,
  ];
  currentMangaPages=mockPages;currentPageIdx=0;
  document.getElementById('totalPages').textContent=mockPages.length;
  displayPage(0);
  document.getElementById('readerModal').classList.add('open');
  document.body.style.overflow='hidden';
}
function displayPage(i){
  if(i<0||i>=currentMangaPages.length) return;
  currentPageIdx=i;
  document.getElementById('readerBody').innerHTML=
    `<div class="reader-page" style="animation:slideUp .4s var(--ease-out-expo)">
      <img src="${currentMangaPages[i]}" alt="Page ${i+1}">
     </div>`;
  document.getElementById('pageInput').value=i+1;
}
function nextPage(){displayPage(currentPageIdx+1)}
function prevPage(){displayPage(currentPageIdx-1)}
function goToPage(p){displayPage(Math.max(0,Math.min(parseInt(p)-1,currentMangaPages.length-1)))}
function closeReader(){
  document.getElementById('readerModal').classList.remove('open');
  document.body.style.overflow='';
}

// ====== NAV ======
function goHome(){
  ['moviesPage','seriesPage','animePage','mangaPage'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('homePage').style.display='';
  document.getElementById('heroSection').style.display='';
  document.querySelectorAll('.nav-link').forEach((b,i)=>b.classList.toggle('active',i===0));
}
function switchNav(idx,btn){
  const types=[null,'movie','tv','anime','manga'];
  if(types[idx]) goSection(types[idx]);
  else goHome();
  document.querySelectorAll('.nav-link').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
async function goSection(type){
  ['homePage'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('heroSection').style.display='none';
  const map={
    movie:{page:'moviesPage',grid:'moviesGrid',ep:'/popular/movie'},
    tv:{page:'seriesPage',grid:'seriesGrid',ep:'/popular/tv'},
    anime:{page:'animePage',grid:'animeGrid',ep:'/popular/tv'},
    manga:{page:'mangaPage',grid:'mangaGrid',ep:null}
  };
  const cfg=map[type];if(!cfg)return;
  document.getElementById(cfg.page).style.display='';
  if(type==='manga'){
    const mangas=[
      {id:'op',title:'One Piece',chapters:1110,emoji:'🏴‍☠️'},
      {id:'nar',title:'Naruto',chapters:700,emoji:'🍃'},
      {id:'aot',title:'Attack on Titan',chapters:139,emoji:'⚔️'},
      {id:'ds',title:'Demon Slayer',chapters:205,emoji:'🗡️'},
      {id:'jjk',title:'Jujutsu Kaisen',chapters:264,emoji:'💫'},
      {id:'sl',title:'Solo Leveling',chapters:179,emoji:'⚡'},
      {id:'cm',title:'Chainsaw Man',chapters:172,emoji:'🔪'},
      {id:'sf',title:'Spy x Family',chapters:102,emoji:'🕵️'},
      {id:'tog',title:'Tower of God',chapters:600,emoji:'🗼'},
      {id:'bc',title:'Black Clover',chapters:370,emoji:'♠️'},
      {id:'ft',title:'Fairy Tail',chapters:545,emoji:'🧝'},
      {id:'vs',title:'Vinland Saga',chapters:200,emoji:'⚓'},
    ];
    document.getElementById(cfg.grid).innerHTML=mangas.map((m,i)=>`
      <div class="card" onclick="openMangaReader('${m.id}','${m.title}')" style="animation-delay:${i*40}ms">
        <div class="card-img">
          <div class="card-placeholder">${m.emoji}</div>
          <div class="card-overlay"></div>
          <button class="card-play">📖</button>
          <div class="card-badge manga">Manga</div>
        </div>
        <div class="card-info">
          <div class="card-title">${m.title}</div>
          <div class="card-meta"><span>${m.chapters} ch.</span></div>
        </div>
      </div>`).join('');
    return;
  }
  const data=await api(cfg.ep);
  if(data?.results){
    document.getElementById(cfg.grid).innerHTML=data.results.map((item,i)=>createCard(item,type,i)).join('');
  }
}

// ====== TOAST ======
let toastTm;
function showToast(msg,dur=2600){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTm);
  toastTm=setTimeout(()=>t.classList.remove('show'),dur);
}

// ====== VIDEO READY ======
document.getElementById('videoPlayer').addEventListener('canplay',()=>{
  document.getElementById('playerLoading').style.display='none';
});
