<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaStream — Streaming Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@100;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080f;--bg2:#0f0f1a;--bg3:#161625;--card:#111120;
  --accent:#ff3d5a;--accent2:#ff6b35;--gold:#f5c518;
  --text:#f0f0f8;--text2:#b0b0c8;--muted:#606080;
  --border:#1e1e32;--anime:#a855f7;--manga:#14b8a6;--success:#10b981;
}
html,body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;overflow-x:hidden;scroll-behavior:smooth}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;height:68px;display:flex;align-items:center;gap:1.5rem;padding:0 2.5rem;background:rgba(8,8,15,.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-logo{font-family:'Space Mono',monospace;font-size:1.4rem;font-weight:700;letter-spacing:.2em;background:linear-gradient(135deg,#ff3d5a,#ff6b35,#ffa502);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;cursor:pointer;flex-shrink:0;transition:letter-spacing .3s}
.nav-logo:hover{letter-spacing:.28em}
.nav-links{display:flex;gap:.3rem;flex:1}
.nav-link{padding:.45rem 1rem;border-radius:.4rem;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .25s;border:none;background:transparent;text-transform:uppercase;letter-spacing:.05em}
.nav-link:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nav-link.active{color:#fff;background:rgba(255,61,90,.12);box-shadow:0 0 20px rgba(255,61,90,.2)}
.nav-right{display:flex;align-items:center;gap:1rem;margin-left:auto}
.search-wrap{position:relative}
.search-wrap input{padding:.45rem 1rem .45rem 2.5rem;background:rgba(255,255,255,.05);border:1.5px solid var(--border);border-radius:.4rem;color:var(--text);font-size:.82rem;font-family:'Outfit',sans-serif;outline:none;transition:all .3s;width:200px}
.search-wrap input:focus{border-color:var(--accent);background:rgba(255,255,255,.08);width:260px;box-shadow:0 0 15px rgba(255,61,90,.2)}
.search-wrap input::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem;pointer-events:none}
.profile-btn{display:flex;align-items:center;gap:.6rem;padding:.35rem .9rem;background:rgba(255,255,255,.05);border:1.5px solid var(--border);border-radius:.4rem;cursor:pointer;transition:all .25s;font-size:.82rem;font-weight:600;color:var(--text)}
.profile-btn:hover{border-color:var(--accent);background:rgba(255,61,90,.08)}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}

/* HERO */
.hero{position:relative;height:100vh;min-height:600px;display:flex;align-items:flex-end;overflow:hidden;margin-top:68px}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 25%;transition:all 1s ease}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 0%,rgba(8,8,15,.8) 40%,rgba(8,8,15,.2) 70%,transparent 100%),linear-gradient(to right,rgba(8,8,15,.98) 0%,rgba(8,8,15,.6) 50%,transparent 100%)}
.hero-content{position:relative;z-index:2;max-width:620px;padding:0 2.5rem 5rem}
.hero-tag{display:inline-flex;align-items:center;gap:.5rem;background:rgba(255,61,90,.15);border:1px solid rgba(255,61,90,.3);border-radius:2rem;padding:.35rem 1rem;font-size:.72rem;font-weight:700;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:1.2rem}
.hero-meta{display:flex;align-items:center;gap:1rem;margin-bottom:1rem;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.hero-rating{color:var(--gold);font-weight:700}
.hero-year{background:rgba(255,255,255,.07);border-radius:.25rem;padding:.2rem .5rem;font-size:.75rem}
.hero h1{font-family:'Space Mono',monospace;font-size:clamp(2.8rem,6vw,5rem);line-height:.94;letter-spacing:.03em;margin-bottom:1.1rem;color:#fff;text-shadow:0 8px 50px rgba(0,0,0,.9);font-weight:700}
.hero p{font-size:.92rem;color:rgba(240,240,248,.7);line-height:1.8;max-width:480px;margin-bottom:2rem;font-weight:300}
.hero-btns{display:flex;gap:1rem;flex-wrap:wrap}
.btn-play{display:flex;align-items:center;gap:.6rem;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:.45rem;padding:.8rem 2.2rem;font-family:'Outfit',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .3s;text-transform:uppercase;letter-spacing:.04em;box-shadow:0 10px 30px rgba(255,61,90,.4)}
.btn-play:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(255,61,90,.5)}
.btn-info{display:flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.15);border-radius:.45rem;padding:.8rem 2.2rem;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .3s;text-transform:uppercase;letter-spacing:.04em}
.btn-info:hover{background:rgba(255,255,255,.12);border-color:var(--accent)}
.hero-dots{display:flex;gap:.5rem;margin-top:2rem}
.dot{width:32px;height:3px;border-radius:2px;background:rgba(255,255,255,.15);cursor:pointer;transition:all .4s;border:none}
.dot.active{background:linear-gradient(to right,var(--accent),var(--accent2));width:52px;box-shadow:0 0 15px rgba(255,61,90,.4)}

/* MAIN */
main{padding:2.5rem;max-width:1800px;margin:0 auto}
.section{margin-bottom:3.5rem}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid rgba(255,255,255,.06)}
.section-title{font-family:'Space Mono',monospace;font-size:1.1rem;letter-spacing:.12em;display:flex;align-items:center;gap:.8rem;text-transform:uppercase;font-weight:700}
.dot-accent{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 12px rgba(255,61,90,.5);flex-shrink:0}
.dot-accent.anime{background:var(--anime);box-shadow:0 0 12px rgba(168,85,247,.5)}
.dot-accent.manga{background:var(--manga);box-shadow:0 0 12px rgba(20,184,166,.5)}
.view-all{font-size:.78rem;color:var(--accent);cursor:pointer;padding:.35rem 1rem;border:1px solid rgba(255,61,90,.25);border-radius:2rem;transition:all .25s;background:transparent;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.view-all:hover{background:rgba(255,61,90,.1);border-color:var(--accent)}

/* CAROUSEL */
.carousel{display:flex;gap:1rem;overflow-x:auto;padding-bottom:.8rem;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:rgba(255,61,90,.3) transparent}
.carousel::-webkit-scrollbar{height:4px}
.carousel::-webkit-scrollbar-thumb{background:rgba(255,61,90,.3);border-radius:2px}

/* CARD */
.card{flex-shrink:0;width:185px;border-radius:.7rem;overflow:hidden;background:var(--card);cursor:pointer;position:relative;border:1px solid var(--border);transition:all .35s cubic-bezier(.34,.1,.68,.55);box-shadow:0 6px 25px rgba(0,0,0,.4)}
.card:hover{transform:translateY(-10px) scale(1.04);border-color:var(--accent);box-shadow:0 18px 50px rgba(255,61,90,.3);z-index:10}
.card-img{width:100%;aspect-ratio:2/3;background:var(--bg3);position:relative;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .card-img img{transform:scale(1.12)}
.card-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3.5rem;background:linear-gradient(135deg,var(--bg3),var(--bg2))}
.card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.95) 0%,rgba(0,0,0,.4) 50%,transparent 100%);opacity:0;transition:opacity .35s;z-index:2}
.card:hover .card-overlay{opacity:1}
.card-play{position:absolute;bottom:1.2rem;left:50%;transform:translateX(-50%) scale(.7);background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:50%;width:54px;height:54px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:1.2rem;opacity:0;transition:all .35s cubic-bezier(.34,.1,.68,.55);z-index:3}
.card:hover .card-play{opacity:1;transform:translateX(-50%) scale(1)}
.card-badge{position:absolute;top:.6rem;right:.6rem;border-radius:.3rem;padding:.25rem .6rem;font-size:.65rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;z-index:4;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 15px rgba(255,61,90,.4)}
.card-badge.anime{background:var(--anime);box-shadow:0 4px 15px rgba(168,85,247,.4)}
.card-badge.manga{background:var(--manga);box-shadow:0 4px 15px rgba(20,184,166,.4)}
.card-info{padding:.8rem}
.card-title{font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:.4rem}
.card-meta{display:flex;align-items:center;gap:.6rem;font-size:.72rem;color:var(--muted)}
.card-rating{color:var(--gold);font-weight:800;font-size:.75rem}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:1.2rem}

/* SKELETON */
.skeleton{border-radius:.7rem;background:linear-gradient(90deg,var(--bg3) 25%,var(--border) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.8s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton.card-sk{width:185px;height:310px}

/* LOAD MORE */
.load-more-wrap{display:flex;justify-content:center;margin-top:2rem}
.btn-load-more{background:rgba(255,61,90,.1);border:1.5px solid rgba(255,61,90,.3);color:var(--accent);border-radius:.5rem;padding:.7rem 2.5rem;cursor:pointer;transition:all .3s;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em}
.btn-load-more:hover{background:rgba(255,61,90,.2);border-color:var(--accent);box-shadow:0 0 20px rgba(255,61,90,.2)}
.btn-load-more:disabled{opacity:.4;cursor:not-allowed}

/* PLAYER MODAL */
.modal{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.97);align-items:center;justify-content:center;animation:fadeIn .3s}
.modal.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* VIDEO PLAYER */
.player-wrap{width:100vw;height:100vh;display:flex;flex-direction:column;background:#000}
.player-topbar{display:flex;align-items:center;gap:1rem;padding:1rem 1.5rem;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);position:absolute;top:0;left:0;right:0;z-index:10}
.player-close-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:1.2rem;transition:all .3s;flex-shrink:0}
.player-close-btn:hover{background:rgba(255,61,90,.3);border-color:var(--accent)}
.player-title-bar{flex:1}
.player-title-bar h3{font-size:1rem;font-weight:700;color:#fff}
.player-title-bar span{font-size:.78rem;color:var(--muted)}
.player-sources{display:flex;gap:.5rem;flex-wrap:wrap}
.source-btn{padding:.3rem .8rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:.3rem;color:var(--muted);cursor:pointer;font-size:.75rem;transition:all .25s;font-weight:600}
.source-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.player-iframe{width:100%;flex:1;border:none;background:#000}

/* EPISODE SELECTOR */
.ep-selector{background:var(--bg2);border-top:1px solid var(--border);padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;flex-shrink:0}
.ep-selector label{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.ep-select{background:rgba(255,255,255,.06);border:1.5px solid var(--border);border-radius:.4rem;color:var(--text);padding:.4rem .8rem;font-size:.82rem;font-family:'Outfit',sans-serif;cursor:pointer;outline:none;transition:all .25s}
.ep-select:focus{border-color:var(--accent)}
.btn-watch{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:.4rem;padding:.4rem 1.2rem;font-weight:700;cursor:pointer;transition:all .25s;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;box-shadow:0 6px 20px rgba(255,61,90,.35)}
.btn-watch:hover{transform:translateY(-1px);box-shadow:0 8px 25px rgba(255,61,90,.45)}

/* MANGA READER */
.reader-wrap{width:100vw;height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.reader-topbar{display:flex;align-items:center;gap:1rem;padding:1rem 1.5rem;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.reader-info{flex:1}
.reader-info h3{font-family:'Space Mono',monospace;font-size:1rem;letter-spacing:.08em;color:var(--text)}
.reader-info span{font-size:.75rem;color:var(--muted)}
.reader-controls{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.reader-select{background:rgba(255,255,255,.06);border:1.5px solid var(--border);border-radius:.4rem;color:var(--text);padding:.35rem .7rem;font-size:.78rem;font-family:'Outfit',sans-serif;cursor:pointer;outline:none;transition:all .25s;max-width:200px}
.reader-select:focus{border-color:var(--manga)}
.reader-mode-btn{padding:.35rem .8rem;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:.4rem;color:var(--muted);cursor:pointer;font-size:.75rem;transition:all .25s;font-weight:600}
.reader-mode-btn.active{background:rgba(20,184,166,.15);border-color:var(--manga);color:var(--manga)}
.reader-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:1.5rem 1rem;gap:.5rem}
.reader-page{max-width:800px;width:100%}
.reader-page img{width:100%;display:block;border-radius:.4rem}
.reader-loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--muted);font-size:.9rem}
.reader-nav{background:var(--bg2);border-top:1px solid var(--border);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:1rem;flex-wrap:wrap}
.reader-nav-btns{display:flex;gap:.5rem}
.btn-nav{background:rgba(20,184,166,.1);border:1.5px solid rgba(20,184,166,.3);color:var(--manga);border-radius:.4rem;padding:.5rem 1.2rem;cursor:pointer;transition:all .25s;font-weight:700;font-size:.82rem}
.btn-nav:hover{background:var(--manga);color:#fff}
.btn-nav:disabled{opacity:.3;cursor:not-allowed}
.reader-page-info{font-size:.82rem;color:var(--muted);font-family:'Space Mono',monospace}

/* DETAIL MODAL */
.detail-modal{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:2rem;animation:fadeIn .3s}
.detail-modal.open{display:flex}
.detail-box{background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--border);border-radius:1rem;max-width:800px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.8)}
.detail-hero{position:relative;height:250px;overflow:hidden;border-radius:1rem 1rem 0 0}
.detail-hero img{width:100%;height:100%;object-fit:cover}
.detail-hero-overlay{position:absolute;inset:0;background:linear-gradient(to top,var(--bg2) 0%,transparent 60%)}
.detail-body{padding:1.5rem 2rem 2rem}
.detail-title{font-family:'Space Mono',monospace;font-size:1.6rem;letter-spacing:.06em;margin-bottom:.8rem;color:#fff}
.detail-meta{display:flex;gap:1rem;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-bottom:1rem}
.detail-meta span{background:rgba(255,255,255,.06);padding:.25rem .6rem;border-radius:.3rem}
.detail-rating{color:var(--gold);font-weight:700}
.detail-overview{font-size:.88rem;color:var(--text2);line-height:1.8;margin-bottom:1.5rem}
.detail-actions{display:flex;gap:1rem;flex-wrap:wrap}
.seasons-wrap{margin-top:1.5rem}
.seasons-title{font-size:.85rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.8rem}
.seasons-grid{display:flex;gap:.5rem;flex-wrap:wrap}
.season-btn{padding:.4rem 1rem;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:.4rem;color:var(--muted);cursor:pointer;font-size:.78rem;font-weight:600;transition:all .25s}
.season-btn.active{background:rgba(255,61,90,.15);border-color:var(--accent);color:var(--accent)}
.episodes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:.5rem;margin-top:.8rem;max-height:180px;overflow-y:auto}
.ep-btn{padding:.5rem;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:.35rem;color:var(--muted);cursor:pointer;font-size:.78rem;font-weight:700;transition:all .25s;text-align:center}
.ep-btn:hover{background:rgba(255,61,90,.1);border-color:var(--accent);color:var(--accent)}

/* TOAST */
#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(20,20,35,.97);border:1.5px solid var(--border);border-radius:.5rem;padding:.7rem 1.5rem;font-size:.82rem;z-index:9999;transition:transform .35s cubic-bezier(.34,.1,.68,.55);pointer-events:none;white-space:nowrap;box-shadow:0 10px 35px rgba(0,0,0,.6)}
#toast.show{transform:translateX(-50%) translateY(0)}

/* API STATUS */
#apiStatus{position:fixed;bottom:.8rem;right:.8rem;z-index:999;font-size:.68rem;font-family:'Space Mono',monospace;padding:.3rem .8rem;border-radius:2rem;background:rgba(8,8,15,.9);border:1px solid var(--border);color:var(--muted);transition:all .5s}
#apiStatus.ok{border-color:var(--success);color:var(--success)}
#apiStatus.err{border-color:var(--accent);color:var(--accent)}

/* PAGES */
.page-header{font-family:'Space Mono',monospace;font-size:1.4rem;letter-spacing:.1em;margin-bottom:2rem;display:flex;align-items:center;gap:.8rem;text-transform:uppercase}

/* RESPONSIVE */
@media(max-width:768px){
  nav{padding:0 1rem;height:60px;gap:1rem}
  .nav-links{display:none}
  .search-wrap input{width:160px}
  .search-wrap input:focus{width:200px}
  .hero-content{padding:0 1.2rem 2.5rem}
  .hero h1{font-size:2rem}
  .hero-btns{flex-direction:column}
  .btn-play,.btn-info{width:100%;justify-content:center}
  main{padding:1.2rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .card{width:auto}
  .detail-box{border-radius:.8rem}
  .detail-body{padding:1.2rem}
}
@media(max-width:480px){
  nav{padding:0 .8rem}
  .nav-logo{font-size:1.1rem}
  .profile-btn span{display:none}
  main{padding:1rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}
</style>
</head>
<body>

<nav>
  <div class="nav-logo" onclick="goHome()">≡ NOVA</div>
  <div class="nav-links">
    <button class="nav-link active" onclick="switchNav(0,this)">Home</button>
    <button class="nav-link" onclick="switchNav(1,this)">Films</button>
    <button class="nav-link" onclick="switchNav(2,this)">Séries</button>
    <button class="nav-link" onclick="switchNav(3,this)">Animés</button>
    <button class="nav-link" onclick="switchNav(4,this)">Manga</button>
  </div>
  <div class="nav-right">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Rechercher..." id="searchInput" onkeyup="handleSearch(event)">
    </div>
    <div class="profile-btn">
      <div class="avatar" id="profileAvatar">👤</div>
      <span id="profileName">Profil</span>
    </div>
  </div>
</nav>

<!-- HERO -->
<div class="hero" id="heroSection">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <div class="hero-tag">⚡ Tendance</div>
    <div class="hero-meta">
      <span class="hero-rating" id="heroRating">★ —</span>
      <span class="hero-year" id="heroYear">—</span>
    </div>
    <h1 id="heroTitle">Chargement...</h1>
    <p id="heroDesc">Connexion à NovaStream...</p>
    <div class="hero-btns">
      <button class="btn-play" id="heroPlayBtn" onclick="playHero()">▶ Regarder</button>
      <button class="btn-info" onclick="infoHero()">ℹ Infos</button>
    </div>
    <div class="hero-dots" id="heroDots"></div>
  </div>
</div>

<!-- MAIN -->
<main id="mainContent">
  <!-- HOME -->
  <div id="homePage">
    <div class="section">
      <div class="section-header">
        <div class="section-title"><div class="dot-accent"></div>Films Tendance</div>
        <button class="view-all" onclick="goSection('movie')">Voir tout →</button>
      </div>
      <div class="carousel" id="trendingCarousel"></div>
    </div>
    <div class="section">
      <div class="section-header">
        <div class="section-title"><div class="dot-accent"></div>Séries Populaires</div>
        <button class="view-all" onclick="goSection('tv')">Voir tout →</button>
      </div>
      <div class="carousel" id="seriesCarousel"></div>
    </div>
    <div class="section">
      <div class="section-header">
        <div class="section-title"><div class="dot-accent anime"></div>Animés</div>
        <button class="view-all" onclick="goSection('anime')">Voir tout →</button>
      </div>
      <div class="carousel" id="animeCarousel"></div>
    </div>
    <div class="section">
      <div class="section-header">
        <div class="section-title"><div class="dot-accent manga"></div>Manga & Webtoon</div>
        <button class="view-all" onclick="goSection('manga')">Voir tout →</button>
      </div>
      <div class="carousel" id="mangaCarousel"></div>
    </div>
  </div>

  <!-- FILMS PAGE -->
  <div id="moviesPage" style="display:none">
    <div class="page-header"><div class="dot-accent"></div>🎬 Films</div>
    <div class="grid" id="moviesGrid"></div>
    <div class="load-more-wrap"><button class="btn-load-more" id="moviesLoadMore" onclick="loadMore('movie')">Charger plus</button></div>
  </div>

  <!-- SERIES PAGE -->
  <div id="seriesPage" style="display:none">
    <div class="page-header"><div class="dot-accent"></div>📺 Séries</div>
    <div class="grid" id="seriesGrid"></div>
    <div class="load-more-wrap"><button class="btn-load-more" id="seriesLoadMore" onclick="loadMore('tv')">Charger plus</button></div>
  </div>

  <!-- ANIME PAGE -->
  <div id="animePage" style="display:none">
    <div class="page-header"><div class="dot-accent anime"></div>⚡ Animés</div>
    <div class="grid" id="animeGrid"></div>
    <div class="load-more-wrap"><button class="btn-load-more" id="animeLoadMore" onclick="loadMore('anime')">Charger plus</button></div>
  </div>

  <!-- MANGA PAGE -->
  <div id="mangaPage" style="display:none">
    <div class="page-header"><div class="dot-accent manga"></div>📖 Manga & Webtoon</div>
    <div class="grid" id="mangaGrid"></div>
    <div class="load-more-wrap"><button class="btn-load-more" id="mangaLoadMore" onclick="loadMoreManga()">Charger plus</button></div>
  </div>

  <!-- SEARCH PAGE -->
  <div id="searchPage" style="display:none">
    <div class="page-header"><div class="dot-accent"></div>🔍 Résultats</div>
    <div class="grid" id="searchGrid"></div>
  </div>
</main>

<!-- VIDEO PLAYER MODAL -->
<div class="modal" id="playerModal">
  <div class="player-wrap">
    <div class="player-topbar">
      <button class="player-close-btn" onclick="closePlayer()">✕</button>
      <div class="player-title-bar">
        <h3 id="playerTitle">Lecteur</h3>
        <span id="playerSubtitle"></span>
      </div>
      <div class="player-sources">
        <button class="source-btn active" onclick="switchSource(0,this)">VidSrc</button>
        <button class="source-btn" onclick="switchSource(1,this)">2Embed</button>
        <button class="source-btn" onclick="switchSource(2,this)">VidSrc Pro</button>
      </div>
    </div>
    <iframe id="playerIframe" class="player-iframe" allowfullscreen allow="fullscreen; autoplay" src="about:blank"></iframe>
    <div class="ep-selector" id="epSelector" style="display:none">
      <label>Saison</label>
      <select class="ep-select" id="seasonSelect" onchange="loadEpisodes()"></select>
      <label>Épisode</label>
      <select class="ep-select" id="episodeSelect"></select>
      <button class="btn-watch" onclick="watchEpisode()">▶ Regarder</button>
    </div>
  </div>
</div>

<!-- MANGA READER MODAL -->
<div class="modal" id="readerModal">
  <div class="reader-wrap">
    <div class="reader-topbar">
      <button class="player-close-btn" onclick="closeReader()">✕</button>
      <div class="reader-info">
        <h3 id="readerTitle">Manga</h3>
        <span id="readerChapterInfo">Chapitre</span>
      </div>
      <div class="reader-controls">
        <select class="reader-select" id="chapterSelect" onchange="loadChapter(this.value)"></select>
        <button class="reader-mode-btn active" id="modeScroll" onclick="setMode('scroll')">↕ Scroll</button>
        <button class="reader-mode-btn" id="modePage" onclick="setMode('page')">▷ Page</button>
      </div>
    </div>
    <div class="reader-body" id="readerBody">
      <div class="reader-loading">Sélectionne un chapitre pour commencer...</div>
    </div>
    <div class="reader-nav" id="readerNav" style="display:none">
      <div class="reader-nav-btns">
        <button class="btn-nav" id="prevChapBtn" onclick="prevChapter()">← Chapitre précédent</button>
        <button class="btn-nav" id="nextChapBtn" onclick="nextChapter()">Chapitre suivant →</button>
      </div>
      <div class="reader-page-info" id="pageInfo"></div>
      <div class="reader-nav-btns" id="pageNavBtns" style="display:none">
        <button class="btn-nav" onclick="prevPage()">← Page préc.</button>
        <button class="btn-nav" onclick="nextPage()">Page suiv. →</button>
      </div>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="detail-modal" id="detailModal">
  <div class="detail-box">
    <div class="detail-hero">
      <img id="detailBackdrop" src="" alt="">
      <div class="detail-hero-overlay"></div>
    </div>
    <div class="detail-body">
      <h2 class="detail-title" id="detailTitle"></h2>
      <div class="detail-meta" id="detailMeta"></div>
      <p class="detail-overview" id="detailOverview"></p>
      <div class="detail-actions">
        <button class="btn-play" onclick="playFromDetail()">▶ Regarder</button>
        <button class="btn-info" onclick="closeDetail()">✕ Fermer</button>
      </div>
      <div class="seasons-wrap" id="seasonsWrap" style="display:none">
        <div class="seasons-title">Saisons & Épisodes</div>
        <div class="seasons-grid" id="seasonsGrid"></div>
        <div class="episodes-grid" id="episodesGrid"></div>
      </div>
    </div>
  </div>
</div>

<div id="apiStatus">⬤ Connexion...</div>
<div id="toast"></div>

<script>
// ============================================================
// ⚙️ CONFIG
// ============================================================
const API_BASE = 'https://novastream-b309.onrender.com';
const POSTER   = 'https://image.tmdb.org/t/p/w500';
const BACKDROP = 'https://image.tmdb.org/t/p/original';
const MANGADEX = 'https://api.mangadex.org';

// Sources vidéo
const SOURCES = [
  (id,type,s,e) => type==='movie'
    ? `https://vidsrc.to/embed/movie/${id}`
    : `https://vidsrc.to/embed/tv/${id}/${s}/${e}`,
  (id,type,s,e) => type==='movie'
    ? `https://www.2embed.cc/embed/${id}`
    : `https://www.2embed.cc/embedtv/${id}&s=${s}&e=${e}`,
  (id,type,s,e) => type==='movie'
    ? `https://vidsrc.xyz/embed/movie?tmdb=${id}`
    : `https://vidsrc.xyz/embed/tv?tmdb=${id}&season=${s}&episode=${e}`
];

// STATE
let heroItems    = [];
let heroTimer    = null;
let currentItem  = null;
let currentType  = null;
let currentPage  = { movie:1, tv:1, anime:1 };
let mangaOffset  = 0;
let mangaChapters= [];
let mangaPages   = [];
let currentPageIdx = 0;
let readerMode   = 'scroll';
let currentSource= 0;
let currentSeason= 1;
let currentEp    = 1;
let detailItem   = null;
let searchTimer  = null;

// ============================================================
// API
// ============================================================
async function api(endpoint) {
  try {
    const res = await fetch(`${API_BASE}/api${endpoint}`, { signal: AbortSignal.timeout(12000) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch(e) {
    console.error('API:', endpoint, e.message);
    return null;
  }
}

async function mangaApi(endpoint) {
  try {
    const res = await fetch(`${MANGADEX}${endpoint}`, { signal: AbortSignal.timeout(12000) });
    return await res.json();
  } catch(e) {
    return null;
  }
}

// ============================================================
// INIT
// ============================================================
(async () => {
  checkAPI();
  loadHome();
})();

async function checkAPI() {
  const badge = document.getElementById('apiStatus');
  try {
    const res = await fetch(`${API_BASE}/health`, { signal: AbortSignal.timeout(8000) });
    if (res.ok) { badge.textContent = '⬤ API OK'; badge.className = 'ok'; }
    else throw new Error();
  } catch {
    badge.textContent = '⬤ API hors ligne';
    badge.className = 'err';
  }
}

// ============================================================
// HOME
// ============================================================
async function loadHome() {
  renderSkeletons('trendingCarousel', 8, true);
  renderSkeletons('seriesCarousel', 8, true);
  renderSkeletons('animeCarousel', 8, true);
  renderMangaSkeletons();

  const [trending, series, anime] = await Promise.all([
    api('/trending/movie'),
    api('/popular/tv'),
    api('/trending/tv')
  ]);

  if (trending?.results) {
    heroItems = trending.results.slice(0,6);
    updateHero(0);
    renderCarousel('trendingCarousel', trending.results.slice(0,14), 'movie');
  }
  if (series?.results) renderCarousel('seriesCarousel', series.results.slice(0,14), 'tv');
  if (anime?.results)  renderCarousel('animeCarousel', anime.results.slice(0,14), 'anime');

  loadMangaCarousel();
}

function renderSkeletons(id, n, isCarousel) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = Array(n).fill(`<div class="skeleton card-sk" style="${isCarousel?'flex-shrink:0':''}"></div>`).join('');
}

function renderMangaSkeletons() {
  document.getElementById('mangaCarousel').innerHTML =
    Array(8).fill('<div class="skeleton card-sk" style="flex-shrink:0"></div>').join('');
}

// ============================================================
// HERO
// ============================================================
function updateHero(idx) {
  if (!heroItems[idx]) return;
  clearTimeout(heroTimer);
  const item = heroItems[idx];
  currentItem = item;

  document.getElementById('heroBg').style.backgroundImage =
    item.backdrop_path ? `url('${BACKDROP+item.backdrop_path}')` : '';
  document.getElementById('heroTitle').textContent = item.title || item.name || '';
  document.getElementById('heroDesc').textContent  = (item.overview||'').slice(0,200)+'…';
  document.getElementById('heroRating').textContent= `★ ${(item.vote_average||0).toFixed(1)}`;
  document.getElementById('heroYear').textContent  = (item.release_date||item.first_air_date||'').slice(0,4);

  const btn = document.getElementById('heroPlayBtn');
  btn.dataset.id    = item.id;
  btn.dataset.type  = item.media_type || 'movie';
  btn.dataset.title = item.title || item.name || '';

  document.getElementById('heroDots').innerHTML = heroItems.map((_,i) =>
    `<button class="dot${i===idx?' active':''}" onclick="updateHero(${i})"></button>`
  ).join('');

  heroTimer = setTimeout(() => updateHero((idx+1)%heroItems.length), 8000);
}

function playHero() {
  const btn = document.getElementById('heroPlayBtn');
  openPlayer(btn.dataset.id, btn.dataset.type || 'movie', btn.dataset.title);
}

function infoHero() {
  if (heroItems.length) openDetail(heroItems[0], 'movie');
}

// ============================================================
// CARDS
// ============================================================
function createCard(item, type) {
  const id     = item.id;
  const title  = item.title || item.name || 'Sans titre';
  const poster = item.poster_path ? POSTER+item.poster_path : '';
  const rating = (item.vote_average||0).toFixed(1);
  const year   = (item.release_date||item.first_air_date||'').slice(0,4);
  const badge  = type==='anime' ? '<div class="card-badge anime">ANIMÉ</div>'
               : type==='manga' ? '<div class="card-badge manga">MANGA</div>' : '';

  return `<div class="card" onclick="openDetail({id:${id},title:'${title.replace(/'/g,"\\'")}',type:'${type}'},null,${id},'${type}')" title="${title}">
    <div class="card-img">
      ${poster ? `<img src="${poster}" alt="${title}" loading="lazy">` : `<div class="card-placeholder">${type==='anime'?'⚡':type==='manga'?'📖':'🎬'}</div>`}
      <div class="card-overlay"></div>
      <button class="card-play" onclick="event.stopPropagation();openPlayer(${id},'${type}','${title.replace(/'/g,"\\'")}')">▶</button>
      ${badge}
    </div>
    <div class="card-info">
      <div class="card-title">${title}</div>
      <div class="card-meta">
        <span class="card-rating">★ ${rating}</span>
        ${year?`<span>${year}</span>`:''}
      </div>
    </div>
  </div>`;
}

function renderCarousel(id, items, type) {
  const el = document.getElementById(id);
  if (el) el.innerHTML = items.map(i => createCard(i, type)).join('');
}

// ============================================================
// MANGA CAROUSEL
// ============================================================
async function loadMangaCarousel() {
  const data = await mangaApi('/manga?limit=12&order[followedCount]=desc&availableTranslatedLanguage[]=fr&includes[]=cover_art');
  if (data?.data) {
    document.getElementById('mangaCarousel').innerHTML = data.data.map(m => {
      const title = m.attributes?.title?.fr || m.attributes?.title?.en || 'Manga';
      const cover = m.relationships?.find(r => r.type==='cover_art');
      const coverUrl = cover ? `https://uploads.mangadex.org/covers/${m.id}/${cover.attributes?.fileName}.256.jpg` : '';
      return `<div class="card" onclick="openMangaReader('${m.id}','${title.replace(/'/g,"\\'")}')">
        <div class="card-img">
          ${coverUrl ? `<img src="${coverUrl}" alt="${title}" loading="lazy">` : '<div class="card-placeholder">📖</div>'}
          <div class="card-overlay"></div>
          <button class="card-play">📖</button>
          <div class="card-badge manga">MANGA</div>
        </div>
        <div class="card-info">
          <div class="card-title">${title}</div>
          <div class="card-meta"><span>MangaDex</span></div>
        </div>
      </div>`;
    }).join('');
  }
}

// ============================================================
// PLAYER
// ============================================================
function openPlayer(id, type, title, season=1, ep=1) {
  currentItem   = { id, type, title };
  currentType   = type;
  currentSeason = season;
  currentEp     = ep;
  currentSource = 0;

  document.getElementById('playerTitle').textContent    = title;
  document.getElementById('playerSubtitle').textContent = type==='movie' ? 'Film' : `Saison ${season} • Épisode ${ep}`;
  document.getElementById('playerModal').classList.add('open');
  document.body.style.overflow = 'hidden';

  const epSel = document.getElementById('epSelector');
  if (type !== 'movie') {
    epSel.style.display = 'flex';
    loadSeasonsForPlayer(id, season);
  } else {
    epSel.style.display = 'none';
  }

  loadSource(id, type, season, ep, 0);
  document.querySelectorAll('.source-btn').forEach((b,i) => b.classList.toggle('active', i===0));
}

function loadSource(id, type, s, e, srcIdx) {
  const url = SOURCES[srcIdx](id, type, s, e);
  document.getElementById('playerIframe').src = url;
}

function switchSource(idx, btn) {
  currentSource = idx;
  document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (currentItem) loadSource(currentItem.id, currentType, currentSeason, currentEp, idx);
}

async function loadSeasonsForPlayer(id, activeSeason=1) {
  const data = await api(`/details/tv/${id}`);
  if (!data?.seasons) return;
  const seasons = data.seasons.filter(s => s.season_number > 0);
  const sel = document.getElementById('seasonSelect');
  sel.innerHTML = seasons.map(s =>
    `<option value="${s.season_number}" ${s.season_number===activeSeason?'selected':''}>${s.name}</option>`
  ).join('');
  loadEpisodes();
}

async function loadEpisodes() {
  const season = parseInt(document.getElementById('seasonSelect').value);
  currentSeason = season;
  const data = await api(`/details/tv/${currentItem.id}`);
  const s = data?.seasons?.find(s => s.season_number===season);
  const count = s?.episode_count || 24;
  document.getElementById('episodeSelect').innerHTML =
    Array.from({length:count},(_,i) => `<option value="${i+1}">Épisode ${i+1}</option>`).join('');
}

function watchEpisode() {
  const s = parseInt(document.getElementById('seasonSelect').value);
  const e = parseInt(document.getElementById('episodeSelect').value);
  currentSeason = s; currentEp = e;
  document.getElementById('playerSubtitle').textContent = `Saison ${s} • Épisode ${e}`;
  loadSource(currentItem.id, currentType, s, e, currentSource);
}

function closePlayer() {
  document.getElementById('playerModal').classList.remove('open');
  document.getElementById('playerIframe').src = 'about:blank';
  document.body.style.overflow = '';
}

// ============================================================
// DETAIL MODAL
// ============================================================
async function openDetail(item, type, id, itemType) {
  const realId   = id || item.id;
  const realType = itemType || type || 'movie';
  const data     = await api(`/details/${realType}/${realId}`);
  if (!data) return;

  detailItem = { ...data, type: realType };

  document.getElementById('detailBackdrop').src =
    data.backdrop_path ? BACKDROP+data.backdrop_path : '';
  document.getElementById('detailTitle').textContent =
    data.title || data.name || '';
  document.getElementById('detailOverview').textContent =
    data.overview || 'Pas de description disponible.';

  const meta = [
    `★ ${(data.vote_average||0).toFixed(1)}`,
    (data.release_date||data.first_air_date||'').slice(0,4),
    data.genres?.slice(0,3).map(g=>g.name).join(', ')
  ].filter(Boolean);
  document.getElementById('detailMeta').innerHTML =
    meta.map(m=>`<span>${m}</span>`).join('');

  const seasonsWrap = document.getElementById('seasonsWrap');
  if (realType !== 'movie' && data.seasons) {
    seasonsWrap.style.display = '';
    const seasons = data.seasons.filter(s => s.season_number > 0);
    document.getElementById('seasonsGrid').innerHTML = seasons.map(s =>
      `<button class="season-btn${s.season_number===1?' active':''}" onclick="selectSeason(${s.season_number},${data.id},this)">${s.name}</button>`
    ).join('');
    await selectSeason(1, data.id, document.querySelector('.season-btn.active'));
  } else {
    seasonsWrap.style.display = 'none';
  }

  document.getElementById('detailModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

async function selectSeason(seasonNum, showId, btn) {
  document.querySelectorAll('.season-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  const data = await api(`/details/tv/${showId}`);
  const s = data?.seasons?.find(s => s.season_number===seasonNum);
  const count = s?.episode_count || 24;

  document.getElementById('episodesGrid').innerHTML = Array.from({length:count},(_,i) =>
    `<button class="ep-btn" onclick="playEpisodeFromDetail(${showId},'${detailItem?.name||''}',${seasonNum},${i+1})">
      ${i+1}
    </button>`
  ).join('');
}

function playEpisodeFromDetail(id, title, season, ep) {
  closeDetail();
  openPlayer(id, 'tv', title, season, ep);
}

function playFromDetail() {
  if (!detailItem) return;
  closeDetail();
  if (detailItem.type === 'movie') {
    openPlayer(detailItem.id, 'movie', detailItem.title || '');
  } else {
    openPlayer(detailItem.id, 'tv', detailItem.name || '', 1, 1);
  }
}

function closeDetail() {
  document.getElementById('detailModal').classList.remove('open');
  document.body.style.overflow = '';
}

// ============================================================
// MANGA READER
// ============================================================
async function openMangaReader(mangaId, title) {
  document.getElementById('readerTitle').textContent   = title;
  document.getElementById('readerChapterInfo').textContent = 'Chargement des chapitres...';
  document.getElementById('readerModal').classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('readerBody').innerHTML = '<div class="reader-loading">⏳ Chargement des chapitres...</div>';
  document.getElementById('readerNav').style.display = 'none';

  const data = await mangaApi(`/manga/${mangaId}/feed?limit=100&order[chapter]=desc&translatedLanguage[]=fr&translatedLanguage[]=en&includes[]=scanlation_group`);
  if (!data?.data?.length) {
    document.getElementById('readerBody').innerHTML = '<div class="reader-loading">❌ Aucun chapitre disponible</div>';
    return;
  }

  mangaChapters = data.data;
  const sel = document.getElementById('chapterSelect');
  sel.innerHTML = mangaChapters.map((ch,i) => {
    const lang = ch.attributes?.translatedLanguage === 'fr' ? '🇫🇷' : '🇬🇧';
    return `<option value="${i}">Ch.${ch.attributes?.chapter||'?'} ${lang} — ${ch.attributes?.title||'Sans titre'}</option>`;
  }).join('');

  document.getElementById('readerChapterInfo').textContent = `${mangaChapters.length} chapitres`;
  document.getElementById('readerNav').style.display = 'flex';
  loadChapter(0);
}

async function loadChapter(idx) {
  idx = parseInt(idx);
  const ch = mangaChapters[idx];
  if (!ch) return;

  document.getElementById('chapterSelect').value = idx;
  document.getElementById('readerChapterInfo').textContent = `Chapitre ${ch.attributes?.chapter||'?'}`;
  document.getElementById('readerBody').innerHTML = '<div class="reader-loading">⏳ Chargement des pages...</div>';

  const data = await mangaApi(`/at-home/server/${ch.id}`);
  if (!data?.chapter) {
    document.getElementById('readerBody').innerHTML = '<div class="reader-loading">❌ Pages introuvables</div>';
    return;
  }

  const base   = data.baseUrl;
  const hash   = data.chapter.hash;
  const pages  = data.chapter.data || [];
  mangaPages   = pages.map(p => `${base}/data/${hash}/${p}`);
  currentPageIdx = 0;

  if (readerMode === 'scroll') renderScrollMode();
  else renderPageMode(0);

  document.getElementById('prevChapBtn').disabled = idx >= mangaChapters.length - 1;
  document.getElementById('nextChapBtn').disabled = idx <= 0;
  document.getElementById('chapterSelect').value = idx;
}

function renderScrollMode() {
  document.getElementById('pageNavBtns').style.display = 'none';
  document.getElementById('pageInfo').textContent = `${mangaPages.length} pages`;
  document.getElementById('readerBody').innerHTML = mangaPages.map((src,i) =>
    `<div class="reader-page"><img src="${src}" alt="Page ${i+1}" loading="lazy"></div>`
  ).join('');
}

function renderPageMode(idx) {
  if (idx < 0 || idx >= mangaPages.length) return;
  currentPageIdx = idx;
  document.getElementById('pageNavBtns').style.display = 'flex';
  document.getElementById('pageInfo').textContent = `Page ${idx+1} / ${mangaPages.length}`;
  document.getElementById('readerBody').innerHTML =
    `<div class="reader-page"><img src="${mangaPages[idx]}" alt="Page ${idx+1}"></div>`;
  document.getElementById('readerBody').scrollTop = 0;
}

function setMode(mode) {
  readerMode = mode;
  document.getElementById('modeScroll').classList.toggle('active', mode==='scroll');
  document.getElementById('modePage').classList.toggle('active', mode==='page');
  if (mode==='scroll') renderScrollMode();
  else renderPageMode(0);
}

function prevPage() { renderPageMode(currentPageIdx-1); }
function nextPage() { renderPageMode(currentPageIdx+1); }

function prevChapter() {
  const idx = parseInt(document.getElementById('chapterSelect').value);
  if (idx < mangaChapters.length-1) loadChapter(idx+1);
}
function nextChapter() {
  const idx = parseInt(document.getElementById('chapterSelect').value);
  if (idx > 0) loadChapter(idx-1);
}

function closeReader() {
  document.getElementById('readerModal').classList.remove('open');
  document.body.style.overflow = '';
}

// ============================================================
// SECTIONS + PAGINATION
// ============================================================
const pageNums = { movie:1, tv:1, anime:1 };

async function goSection(type) {
  clearTimeout(heroTimer);
  document.getElementById('heroSection').style.display = 'none';
  hideAllPages();

  const cfg = {
    movie: { page:'moviesPage', grid:'moviesGrid', ep:'/popular/movie'  },
    tv:    { page:'seriesPage', grid:'seriesGrid',  ep:'/popular/tv'    },
    anime: { page:'animePage',  grid:'animeGrid',   ep:'/trending/tv'   },
    manga: { page:'mangaPage',  grid:'mangaGrid',   ep:null             }
  }[type];
  if (!cfg) return;

  document.getElementById(cfg.page).style.display = '';
  pageNums[type] = 1;

  if (type === 'manga') { loadMangaGrid(true); return; }

  renderSkeletons(cfg.grid, 20, false);
  const data = await api(`${cfg.ep}?page=1`);
  if (data?.results) {
    document.getElementById(cfg.grid).innerHTML = data.results.map(i => createCard(i, type)).join('');
  }
}

async function loadMore(type) {
  pageNums[type]++;
  const cfg = {
    movie: { grid:'moviesGrid', ep:'/popular/movie',  btn:'moviesLoadMore' },
    tv:    { grid:'seriesGrid',  ep:'/popular/tv',    btn:'seriesLoadMore' },
    anime: { grid:'animeGrid',   ep:'/trending/tv',   btn:'animeLoadMore'  }
  }[type];
  const btn = document.getElementById(cfg.btn);
  btn.textContent = 'Chargement...';
  btn.disabled = true;

  const data = await api(`${cfg.ep}?page=${pageNums[type]}`);
  if (data?.results) {
    document.getElementById(cfg.grid).insertAdjacentHTML('beforeend',
      data.results.map(i => createCard(i, type)).join('')
    );
    btn.textContent = 'Charger plus';
    btn.disabled = false;
    if (pageNums[type] >= data.total_pages) { btn.textContent = 'Fin'; btn.disabled = true; }
  }
}

// ---- MANGA GRID ----
async function loadMangaGrid(reset=false) {
  if (reset) mangaOffset = 0;
  const btn = document.getElementById('mangaLoadMore');
  btn.textContent = 'Chargement...';
  btn.disabled = true;

  const data = await mangaApi(`/manga?limit=20&offset=${mangaOffset}&order[followedCount]=desc&includes[]=cover_art&availableTranslatedLanguage[]=fr`);
  const grid = document.getElementById('mangaGrid');
  if (reset) grid.innerHTML = '';

  if (data?.data) {
    grid.insertAdjacentHTML('beforeend', data.data.map(m => {
      const title = m.attributes?.title?.fr || m.attributes?.title?.en || 'Manga';
      const cover = m.relationships?.find(r => r.type==='cover_art');
      const coverUrl = cover ? `https://uploads.mangadex.org/covers/${m.id}/${cover.attributes?.fileName}.256.jpg` : '';
      return `<div class="card" onclick="openMangaReader('${m.id}','${title.replace(/'/g,"\\'")}')">
        <div class="card-img">
          ${coverUrl ? `<img src="${coverUrl}" alt="${title}" loading="lazy">` : '<div class="card-placeholder">📖</div>'}
          <div class="card-overlay"></div>
          <button class="card-play">📖</button>
          <div class="card-badge manga">MANGA</div>
        </div>
        <div class="card-info">
          <div class="card-title">${title}</div>
          <div class="card-meta"><span>MangaDex</span></div>
        </div>
      </div>`;
    }).join(''));

    mangaOffset += 20;
    btn.textContent = 'Charger plus';
    btn.disabled = false;
    if (mangaOffset >= (data.total||0)) { btn.textContent = 'Fin'; btn.disabled = true; }
  }
}

function loadMoreManga() { loadMangaGrid(false); }

// ============================================================
// NAVIGATION
// ============================================================
function hideAllPages() {
  ['homePage','moviesPage','seriesPage','animePage','mangaPage','searchPage']
    .forEach(id => document.getElementById(id).style.display = 'none');
}

function goHome() {
  clearTimeout(heroTimer);
  hideAllPages();
  document.getElementById('homePage').style.display = '';
  document.getElementById('heroSection').style.display = '';
  document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.nav-link')[0].classList.add('active');
  loadHome();
}

function switchNav(idx, btn) {
  const types = [null,'movie','tv','anime','manga'];
  if (types[idx]) goSection(types[idx]); else goHome();
  document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ============================================================
// SEARCH
// ============================================================
function handleSearch(e) {
  if (e.key === 'Enter') doSearch();
  else { clearTimeout(searchTimer); searchTimer = setTimeout(doSearch, 600); }
}

async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) { goHome(); return; }

  clearTimeout(heroTimer);
  document.getElementById('heroSection').style.display = 'none';
  hideAllPages();
  document.getElementById('searchPage').style.display = '';

  const grid = document.getElementById('searchGrid');
  grid.innerHTML = '<div class="skeleton card-sk" style="grid-column:1/-1;height:60px"></div>';

  const data = await api(`/search?q=${encodeURIComponent(q)}&type=multi`);
  if (data?.results?.length) {
    grid.innerHTML = data.results
      .filter(i => i.media_type !== 'person')
      .map(i => createCard(i, i.media_type||'movie'))
      .join('');
  } else {
    grid.innerHTML = '<div style="color:var(--muted);padding:3rem;grid-column:1/-1">Aucun résultat pour "'+q+'"</div>';
  }
}

// ============================================================
// TOAST + KEYBOARD
// ============================================================
function showToast(msg, d=2800) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), d);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePlayer(); closeReader(); closeDetail(); }
});
</script>
